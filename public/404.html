<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面未找到 - Apauto-to-all</title>
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #007bff 0%, #6610f2 100%);
        --text-color: #606266;
        --bg-color: #ffffff;
        --border-color: #ebeef5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .main-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }

      .not-found {
        max-width: 600px;
      }

      .error-code {
        font-size: 8rem;
        font-weight: bold;
        background: var(--primary-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
        margin-bottom: 0.5rem;
      }

      .error-title {
        font-size: 2rem;
        margin-bottom: 1.5rem;
        color: #303133;
      }

      .error-message {
        font-size: 1.1rem;
        margin-bottom: 2rem;
        color: var(--text-color);
      }

      .home-link {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 2rem;
        background: var(--primary-gradient);
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        transition: all 0.3s ease;
        box-shadow: 0 2px 12px 0 rgba(0, 123, 255, 0.3);
      }

      .home-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px 0 rgba(0, 123, 255, 0.5);
      }

      .countdown {
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        const path = window.location.pathname;
        const search = window.location.search;
        const hash = window.location.hash;

        // 构建重定向URL
        const baseUrl = window.location.origin;

        // 设置重定向按钮链接
        document.getElementById("redirect-btn").href = baseUrl;

        // 五秒后自动重定向
        let countdown = 5;
        const countdownEl = document.getElementById("countdown");
        const interval = setInterval(function () {
          countdown--;
          countdownEl.textContent = countdown;
          if (countdown <= 0) {
            clearInterval(interval);
            window.location.href = baseUrl;
          }
        }, 1000);
      });
    </script>
  </head>
  <body>
    <main class="main-content">
      <div class="not-found">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">页面未找到</h2>
        <p class="error-message">
          很抱歉，您访问的页面不存在或已被移动。<br />
          请检查您输入的网址是否正确。
        </p>
        <a id="redirect-btn" href="/" class="home-link">返回首页</a>
        <p class="countdown">
          <span id="countdown">5</span> 秒后自动返回首页...
        </p>
      </div>
    </main>
  </body>
</html>
